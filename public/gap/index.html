<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>THE GAP — a game about numbers you can't feel</title>
<style>
/* ============================================================
   THE GAP — single-file wealth inequality game
   No fonts, no CDNs, no fetch. Works offline.
   ============================================================ */
:root{
  --bg:#0a0e14; --bg2:#101623; --panel:#141c2b; --line:#223047;
  --txt:#e8eef7; --dim:#8fa0b8; --faint:#57657d;
  --c1:#38e1ff; --c2:#43e97b; --c3:#ff5c47; --gold:#ffd166;
  --accent:var(--c1);
  --maxw:720px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--txt);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  line-height:1.45; overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
body[data-act="1"]{--accent:var(--c1)}
body[data-act="2"]{--accent:var(--c2)}
body[data-act="3"]{--accent:var(--c3)}

/* ---------- header ---------- */
header{
  position:fixed; top:0; left:0; right:0; z-index:50;
  display:flex; align-items:center; gap:10px;
  padding:10px 14px calc(10px);
  background:linear-gradient(to bottom, rgba(10,14,20,.96), rgba(10,14,20,.82) 70%, transparent);
  pointer-events:none;
}
header > *{pointer-events:auto}
.brand{font-weight:900; letter-spacing:.06em; font-size:14px; color:var(--txt); white-space:nowrap}
.brand em{font-style:normal;color:var(--accent)}
.dots{display:flex; gap:4px; flex:1; min-width:0; justify-content:center}
.dot{width:6px;height:6px;border-radius:50%;background:var(--line);transition:background .3s, transform .3s}
.dot.done{background:var(--dim)}
.dot.now{background:var(--accent); transform:scale(1.5)}
.regionToggle{
  display:flex; border:1px solid var(--line); border-radius:999px; overflow:hidden;
  font-size:12px; font-weight:700; cursor:pointer; user-select:none; flex:none;
}
.regionToggle span{padding:4px 10px; color:var(--dim)}
.regionToggle span.on{background:var(--accent); color:#04121a}
.regionToggle.pinned{opacity:.55}
.ticker{
  position:fixed; bottom:10px; right:12px; z-index:50;
  font-variant-numeric:tabular-nums; font-size:11px; color:var(--faint);
  background:rgba(10,14,20,.7); border:1px solid var(--line);
  padding:3px 9px; border-radius:999px; letter-spacing:.03em;
}

/* ---------- stage / screens ---------- */
main{min-height:100svh; display:flex; flex-direction:column}
.screen{
  flex:1; width:100%; max-width:var(--maxw); margin:0 auto;
  padding:74px 20px 90px; display:flex; flex-direction:column; justify-content:center;
  animation:enter .5s ease both;
}
@keyframes enter{from{opacity:0; transform:translateY(14px)}to{opacity:1;transform:none}}
.kicker{
  color:var(--accent); font-weight:800; letter-spacing:.18em; font-size:12px;
  text-transform:uppercase; margin-bottom:10px;
}
h1{font-size:clamp(34px,7vw,64px); font-weight:900; line-height:1.05; letter-spacing:-.01em}
h2{font-size:clamp(24px,5vw,40px); font-weight:900; line-height:1.1}
.lead{color:var(--dim); font-size:clamp(15px,2.4vw,18px); margin-top:12px; max-width:56ch}
.hero-num{
  font-size:clamp(46px,11vw,120px); font-weight:900; line-height:1;
  font-variant-numeric:tabular-nums; letter-spacing:-.02em; color:var(--accent);
  margin:8px 0; overflow-wrap:anywhere;
}
.sub-num{font-size:clamp(20px,4vw,30px); font-weight:800; font-variant-numeric:tabular-nums}
.note{color:var(--faint); font-size:13px; margin-top:10px}
.punch{
  margin-top:18px; padding:14px 16px; border-left:3px solid var(--accent);
  background:var(--bg2); border-radius:0 10px 10px 0;
  font-size:clamp(15px,2.6vw,18px);
}
.punch b{color:var(--accent)}

/* ---------- controls ---------- */
.btn{
  appearance:none; border:0; cursor:pointer; font:inherit; font-weight:900;
  background:var(--accent); color:#06131b; padding:14px 26px; border-radius:12px;
  font-size:17px; letter-spacing:.02em; margin-top:22px; align-self:flex-start;
  transition:transform .1s, filter .15s;
}
.btn:active{transform:scale(.97)}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent; color:var(--accent); border:1.5px solid var(--accent)}
.btn.small{padding:9px 16px; font-size:14px; margin-top:12px}
.btnrow{display:flex; gap:12px; flex-wrap:wrap; align-items:center}
.choices{display:flex; flex-direction:column; gap:10px; margin-top:20px}
.choice{
  border:1.5px solid var(--line); background:var(--panel); color:var(--txt);
  padding:14px 18px; border-radius:12px; font:inherit; font-size:16px; font-weight:700;
  cursor:pointer; text-align:left; transition:border-color .15s, background .15s;
}
.choice:hover{border-color:var(--accent)}
.choice.picked{border-color:var(--accent); background:var(--bg2)}
input[type=range]{
  width:100%; margin:26px 0 6px; accent-color:var(--accent); height:34px; cursor:pointer;
}
.slider-read{
  font-size:clamp(26px,6vw,44px); font-weight:900; color:var(--accent);
  font-variant-numeric:tabular-nums; min-height:1.2em;
}
input[type=text],input[type=number]{
  font:inherit; font-size:18px; font-weight:700; color:var(--txt);
  background:var(--panel); border:1.5px solid var(--line); border-radius:10px;
  padding:12px 14px; width:100%; max-width:280px;
}
input:focus{outline:2px solid var(--accent); border-color:transparent}
.presets{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px}
.preset{
  font-size:13px; font-weight:700; color:var(--dim); background:var(--panel);
  border:1px solid var(--line); border-radius:999px; padding:6px 12px; cursor:pointer;
}
.preset.on,.preset:hover{color:var(--accent); border-color:var(--accent)}

/* ---------- guess / reveal ---------- */
.reveal{animation:pop .55s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{opacity:0; transform:scale(.85)}to{opacity:1;transform:scale(1)}}
.guess-pin{
  display:inline-block; font-size:13px; font-weight:800; color:var(--bg);
  background:var(--dim); padding:3px 10px; border-radius:999px; margin-bottom:6px;
}
.vs-row{display:flex; gap:22px; margin-top:16px; flex-wrap:wrap}
.vs-row > div{flex:1; min-width:180px}
.vs-label{font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); font-weight:800}

/* ---------- source chips ---------- */
.chip{
  display:inline-flex; align-items:center; gap:5px;
  font-size:11px; font-weight:700; color:var(--dim);
  border:1px solid var(--line); border-radius:999px; padding:3px 10px;
  cursor:pointer; margin:14px 8px 0 0; user-select:none; background:rgba(20,28,43,.6);
}
.chip:hover{color:var(--accent); border-color:var(--accent)}
.chip::before{content:"ⓘ"; font-size:12px}
.chippop{
  position:fixed; z-index:90; max-width:320px; background:var(--panel);
  border:1px solid var(--line); border-radius:12px; padding:12px 14px; font-size:13px;
  color:var(--txt); box-shadow:0 12px 40px rgba(0,0,0,.5);
}
.chippop .cs{color:var(--faint); font-size:11px; margin-top:6px; display:block}
.chiprow{display:flex; flex-wrap:wrap}

/* ---------- box fields (unit-square engine) ---------- */
.boxfield{
  display:grid; gap:2px; margin-top:16px;
  grid-template-columns:repeat(var(--cols,10),1fr);
  width:min(100%, 520px);
}
.boxfield .bx{
  aspect-ratio:1; background:var(--accent); border-radius:2px;
  animation:bxin .3s ease both;
}
.boxfield .bx.gold{background:var(--gold)}
.boxfield .bx.dim{background:var(--line)}
.boxfield .bx.out{outline:1.5px solid var(--accent); outline-offset:-1.5px; background:transparent}
@keyframes bxin{from{opacity:0; transform:scale(.4)}to{opacity:1;transform:scale(1)}}
.megawrap{
  position:relative; margin-top:16px; max-height:440px; overflow-y:auto;
  border-radius:8px; border:1px solid var(--line); overscroll-behavior:contain;
}
.megafield{
  width:100%;
  background-image:
    linear-gradient(to right, var(--bg) 1px, transparent 1px),
    linear-gradient(to bottom, var(--bg) 1px, transparent 1px),
    linear-gradient(var(--accent), var(--accent));
  background-size:var(--cell,6px) var(--cell,6px), var(--cell,6px) var(--cell,6px), 100% 100%;
}
.megawrap .cap{
  position:sticky; bottom:8px; margin:0 8px 8px auto; width:max-content; max-width:90%;
  display:block; font-size:12px; font-weight:800;
  background:rgba(10,14,20,.9); padding:4px 12px; border-radius:999px; color:var(--txt);
  border:1px solid var(--line);
}
.fieldlabel{margin-top:8px; font-size:14px; color:var(--dim); font-weight:700}
.fieldlabel b{color:var(--accent)}

/* ---------- odometers / race ---------- */
.race{display:flex; gap:14px; margin-top:20px; flex-wrap:wrap}
.race .lane{
  flex:1; min-width:230px; background:var(--panel); border:1px solid var(--line);
  border-radius:14px; padding:16px;
}
.race .lane h4{font-size:13px; letter-spacing:.1em; text-transform:uppercase; color:var(--dim)}
.odo{
  font-size:clamp(26px,5.4vw,42px); font-weight:900; font-variant-numeric:tabular-nums;
  margin-top:8px; letter-spacing:-.01em;
}
.lane.you .odo{color:var(--txt)}
.lane.him .odo{color:var(--c2)}
.lane .per{font-size:12px; color:var(--faint); margin-top:4px}
.lane.overdrive{box-shadow:0 0 0 1.5px var(--c3) inset}
.lane.overdrive .odo{color:var(--c3)}

/* ---------- banquet ---------- */
.icons{display:flex; flex-wrap:wrap; gap:3px; margin-top:14px}
.person{width:14px; height:22px; position:relative; opacity:.9}
.person::before{content:""; position:absolute; top:0; left:4px; width:6px; height:6px; border-radius:50%; background:currentColor}
.person::after{content:""; position:absolute; top:7px; left:2.5px; width:9px; height:14px; border-radius:4px 4px 2px 2px; background:currentColor}
.wealthbar{display:flex; height:34px; border-radius:8px; overflow:hidden; margin-top:16px; width:100%}
.wealthbar > div{transition:width 1s cubic-bezier(.2,.9,.3,1); position:relative; min-width:0}
.seglabel{font-size:11px; font-weight:800; color:var(--dim); display:flex; justify-content:space-between; margin-top:6px; gap:6px; flex-wrap:wrap}

/* ---------- outline (wealth vs income) ---------- */
.outlinewrap{display:flex; gap:26px; margin-top:20px; flex-wrap:wrap; align-items:flex-end}
.owbox{position:relative; border:2px solid var(--accent); border-radius:6px; flex:none}
.owfill{position:absolute; bottom:0; left:0; right:0; background:var(--accent); opacity:.85; border-radius:0 0 4px 4px; transition:height .5s ease}
.owlab{font-size:12px; color:var(--dim); font-weight:700; margin-top:8px; max-width:180px}

/* ---------- spend it ---------- */
.spendgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; margin-top:18px}
.buy{
  background:var(--panel); border:1.5px solid var(--line); border-radius:12px;
  padding:12px; cursor:pointer; font:inherit; color:var(--txt); text-align:left;
  transition:border-color .15s, transform .1s;
}
.buy:hover{border-color:var(--c2)}
.buy:active{transform:scale(.96)}
.buy .bi{font-size:22px}
.buy .bn{font-weight:800; font-size:14px; margin-top:4px}
.buy .bp{color:var(--c2); font-weight:900; font-size:13px; font-variant-numeric:tabular-nums}
.buy .bought{color:var(--faint); font-size:11px; font-weight:700}
.spendbar{height:26px; border-radius:8px; background:var(--line); overflow:hidden; margin-top:18px; position:relative}
.spendbar .left{height:100%; background:var(--c2); transition:width .3s ease}
.spendstats{display:flex; justify-content:space-between; font-size:13px; font-weight:800; margin-top:8px; font-variant-numeric:tabular-nums; flex-wrap:wrap; gap:8px}
.gain{color:var(--c2)} .spent{color:var(--c3)}

/* ---------- tax drain ---------- */
.drainrow{display:flex; gap:26px; margin-top:20px; flex-wrap:wrap}
.draincol{flex:1; min-width:230px}
.drainfield{display:grid; grid-template-columns:repeat(10,1fr); gap:2px; width:min(100%,300px)}
.drainfield .bx{aspect-ratio:1; background:var(--accent); border-radius:2px; transition:transform .7s ease, opacity .7s ease}
.drainfield .bx.gone{transform:translateY(46px) rotate(12deg); opacity:0}
.rate-big{font-size:clamp(30px,6vw,52px); font-weight:900; font-variant-numeric:tabular-nums}

/* ---------- comic / cards ---------- */
.panelcard{
  background:var(--panel); border:1px solid var(--line); border-radius:16px;
  padding:20px; margin-top:16px;
}
.panelcard h3{font-size:20px; font-weight:900; margin-bottom:6px}
.panelcard h3 .step{color:var(--accent)}
.panelcard p{color:var(--dim); font-size:15px}
.diagram{margin:14px 0 4px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-weight:800; font-size:14px}
.diagram .dbox{border:2px solid var(--accent); border-radius:6px; padding:8px 12px}
.diagram .dfill{background:var(--accent); color:#06131b; border-radius:6px; padding:8px 12px}
.diagram .arrow{color:var(--faint); font-size:18px}

/* ---------- levers ---------- */
.lever{margin-top:22px}
.lever .lhead{display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap}
.lever .lname{font-weight:800; font-size:15px}
.lever .lval{font-weight:900; color:var(--accent); font-variant-numeric:tabular-nums; font-size:18px}
.tradeoffs{display:flex; flex-direction:column; gap:10px; margin-top:18px}
.tcard{
  background:var(--bg2); border:1px solid var(--line); border-left:3px solid var(--accent);
  border-radius:0 12px 12px 0; padding:12px 14px; font-size:15px;
}
.tcard b{color:var(--accent); font-variant-numeric:tabular-nums}

/* ---------- finale / misc ---------- */
.replay{display:flex; flex-direction:column; gap:8px; margin-top:18px}
.rrow{
  display:flex; justify-content:space-between; gap:10px; background:var(--panel);
  border:1px solid var(--line); border-radius:10px; padding:10px 14px; font-size:14px;
  font-weight:700; flex-wrap:wrap;
}
.rrow .g{color:var(--dim)} .rrow .a{color:var(--accent); font-variant-numeric:tabular-nums}
.bigwrap{text-align:center; margin:10px 0}
.timeline{position:relative; height:70px; margin-top:24px; border-bottom:2px solid var(--line)}
.tmark{position:absolute; bottom:0; transform:translateX(-50%); text-align:center; font-size:11px; color:var(--faint); font-weight:700; white-space:nowrap}
.tmark::after{content:""; display:block; width:2px; height:10px; background:var(--faint); margin:4px auto 0}
.tmark.hot{color:var(--accent)} .tmark.hot::after{background:var(--accent)}
.sandnav{display:flex; gap:8px; flex-wrap:wrap; margin-top:18px}
.sandsec{margin-top:26px; border-top:1px solid var(--line); padding-top:18px}
select{
  font:inherit; font-weight:700; font-size:16px; color:var(--txt);
  background:var(--panel); border:1.5px solid var(--line); border-radius:10px; padding:10px 14px;
}
.statgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; margin-top:16px}
.stat{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px}
.stat .sv{font-size:clamp(20px,4vw,30px); font-weight:900; color:var(--accent); font-variant-numeric:tabular-nums; overflow-wrap:anywhere}
.stat .sl{font-size:12px; color:var(--dim); font-weight:700; margin-top:4px}
.asof{margin-top:26px; font-size:12px; color:var(--faint)}
.skipline{margin-top:16px}
.skipline a{color:var(--faint); font-size:13px; cursor:pointer; text-decoration:underline}

/* ---------- present mode / responsive / motion ---------- */
body.present .chip{font-size:0; padding:6px}
body.present .chip::before{font-size:14px}
body.present{--maxw:980px}
body.present h1{font-size:clamp(44px,8vw,96px)}
body.present .hero-num{font-size:clamp(60px,13vw,170px)}
@media (max-width:480px){
  .screen{padding:64px 16px 80px}
  .btn{width:100%; text-align:center}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s !important; transition-duration:.001s !important}
}
</style>
</head>
<body data-act="0">
<header>
  <div class="brand">THE <em>GAP</em></div>
  <div class="dots" id="dots"></div>
  <div class="regionToggle" id="regionToggle" title="Switch dataset">
    <span data-r="us" class="on">🇺🇸 US</span><span data-r="global">🌍 World</span>
  </div>
</header>
<div class="ticker" id="ticker" title="Elapsed session time">0:00</div>
<main id="stage"></main>
<script>
"use strict";
/* ================================================================
   DATA — every number carries a source. Frozen July 17, 2026.
   ================================================================ */
const DATA = {
  asOf: "July 2026",
  sources: {

    propublica:{name:"ProPublica — “The Secret IRS Files” (true tax rate = tax paid ÷ wealth growth, 2014–2018)", url:"https://www.propublica.org/article/the-secret-irs-files-trove-of-never-before-seen-records-reveal-how-the-wealthiest-avoid-income-tax", asOf:"June 2021"},
    sp500: {name:"S&P 500 long-run annualized total return since 1957 (~10.4% nominal)", url:"https://www.officialdata.org/us/stocks/s-p-500/1957", asOf:"through 2025"},

  },
  us: {
    medianWage: 64220,          // $/yr, BLS Q1 2026 ($1,235/wk)

    meanNetWorth: 1063700,      // SCF 2022
    totalWealth: 184.1e12,      // Z.1 Q4 2025

    bottom41Share: .01,         // 41% of adults hold <1%
    top1Share: .37, bottom50Share: .02,                // WID
    adults: 3.8e9,
    billionaires: 3428, billionaireWealth: 20.1e12     // Forbes 2026: ≈4% of global wealth
  },
  billionaires: [ // Forbes, July 1 2026
    {name:"Elon Musk",        worth:1.053e12, note:"first trillionaire in history — +$218B in 30 days (June 2026)"},
    {name:"Larry Page",       worth:291e9},
    {name:"Sergey Brin",      worth:269e9},
    {name:"Jeff Bezos",       worth:249e9},
    {name:"Mark Zuckerberg",  worth:241e9},

    {name:"Warren Buffett",   worth:147.8e9}
  ],
  muskJuneGainPerSec: 218e9/(30*86400),     // ≈ $84,100/sec, actual June 2026
  marketReturn: .104,                        // S&P nominal, long run
  trueTaxRates: [                            // ProPublica 2014–2018; Musk first — he's the archetype
    {name:"Elon Musk",      rate:.0327, extra:"wealth grew $13.9B; paid $455M — and $0 federal income tax in 2018"},
    {name:"Michael Bloomberg", rate:.013},

/* ================================================================
   fmt — number formatting
   ================================================================ */
const fmt = {
  money(n){ return "$" + Math.round(n).toLocaleString("en-US"); },
  money2(n){ return "$" + n.toLocaleString("en-US",{minimumFractionDigits:2, maximumFractionDigits:2}); },
  big(n){
    const a = Math.abs(n);
    if (a >= 1e12) return "$" + trim(n/1e12) + "T";
    if (a >= 1e9)  return "$" + trim(n/1e9)  + "B";
    if (a >= 1e6)  return "$" + trim(n/1e6)  + "M";
    if (a >= 1e3)  return "$" + trim(n/1e3)  + "k";
    return fmt.money(n);
    function trim(x){ return (Math.round(x*100)/100).toLocaleString("en-US",{maximumFractionDigits: x<10?2: x<100?1:0}); }
  },
  years(y){
    if (y >= 1e6) return (Math.round(y/1e5)/10).toLocaleString() + " million years";
    if (y >= 1e3) return Math.round(y/100)*100 >= 10000 ? Math.round(y/1000).toLocaleString()+",000 years" : Math.round(y).toLocaleString()+" years";
    return Math.round(y).toLocaleString() + " years";
  },
  pct(p, d=1){ return (p*100).toFixed(d).replace(/\.0+$/,"") + "%"; },
  clock(sec){
    const m = Math.floor(sec/60), s = Math.floor(sec%60);
    return m + ":" + String(s).padStart(2,"0");
  }
};

/* ================================================================
   anim — one rAF manager
   ================================================================ */
const anim = {
  handles: new Set(),
  reduced: matchMedia("(prefers-reduced-motion: reduce)").matches,
  raf(fn){
    let id, live = true;
    const step = (t)=>{ if(!live) return; if (fn(t) !== false) id = requestAnimationFrame(step); };
    id = requestAnimationFrame(step);
    const h = {stop(){ live=false; cancelAnimationFrame(id); anim.handles.delete(h); }};
    this.handles.add(h);
    return h;
  },
  stopAll(){ [...this.handles].forEach(h=>h.stop()); },
  tween(from, to, ms, onUpdate, ease = t=>1-Math.pow(1-t,3), onDone){
    if (this.reduced) ms = 1;
    const t0 = performance.now();
    return this.raf(now=>{
      const p = Math.min(1,(now-t0)/ms);
      onUpdate(from + (to-from)*ease(p), p);
      if (p >= 1){ onDone && onDone(); return false; }
    });
  },
  odometer(el, valueFn, fmtFn = fmt.money){
    return this.raf(()=>{ el.textContent = fmtFn(valueFn()); });
  }
};

/* ================================================================
   dom helpers
   ================================================================ */
function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  if (attrs) for (const [k,v] of Object.entries(attrs)){
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "style") el.style.cssText = v;
    else el.setAttribute(k, v);
  }
  for (const kid of kids.flat()){
    if (kid == null) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(kid));
  }
  return el;
}
function chip(srcId, label){
  const s = DATA.sources[srcId];
  if (!s) return null;
  const c = h("span", {class:"chip", role:"button", tabindex:"0"}, label || s.name.split("—")[0].trim());
  const open = (ev)=>{
    document.querySelectorAll(".chippop").forEach(p=>p.remove());
    const pop = h("div",{class:"chippop"},
      h("div",{}, s.name),
      h("span",{class:"cs"}, "As of " + s.asOf + " · " + s.url)
    );
    document.body.append(pop);
    const r = c.getBoundingClientRect();
    pop.style.left = Math.min(innerWidth - pop.offsetWidth - 10, Math.max(10, r.left)) + "px";
    pop.style.top = (r.top > innerHeight/2 ? r.top - pop.offsetHeight - 8 : r.bottom + 8) + "px";
    setTimeout(()=>addEventListener("click", function h2(e){ if(!pop.contains(e.target)){ pop.remove(); removeEventListener("click",h2);} }), 0);
    ev.stopPropagation();
  };
  c.addEventListener("click", open);
  c.addEventListener("keydown", e=>{ if(e.key==="Enter") open(e); });
  return c;
}
function chips(...ids){ return h("div",{class:"chiprow"}, ids.map(id=>chip(id))); }

/* Unit-square renderers */
function boxGrid(n, opts = {}){
  // literal DOM boxes — for counts the eye can actually read (≤ ~2500)
  const cols = opts.cols || Math.min(50, Math.ceil(Math.sqrt(n*2)));
  const g = h("div",{class:"boxfield", style:`--cols:${cols}`});
  for (let i=0;i<n;i++){
    const b = h("div",{class:"bx" + (opts.cls ? " "+opts.cls(i) : "")});
    if (!anim.reduced && n <= 400) b.style.animationDelay = (i * Math.min(3, 600/n)) + "ms";
    g.append(b);
  }
  return g;
}
function megaField(n, opts = {}){
  // virtualized: CSS grid texture sized by count — for thousands to millions.
  // The full field can be tens of thousands of px tall; it lives inside a
  // scrollable viewport with a depth meter, so scrolling through it IS the beat.
  const cell = opts.cell || 6;
  const label = opts.label || n.toLocaleString() + " boxes";
  const field = h("div",{class:"megafield", style:`--cell:${cell}px`});
  const depth = h("div",{class:"cap"}, label);
  const wrap = h("div",{class:"megawrap"}, field, depth);
  requestAnimationFrame(()=>{
    const cols = Math.max(1, Math.floor(field.clientWidth / cell));
    const hpx = Math.max(cell, Math.ceil(n / cols) * cell);
    field.style.height = hpx + "px";
    if (hpx > wrap.clientHeight + 20){
      const update = ()=>{
        const p = Math.min(100, (wrap.scrollTop + wrap.clientHeight) / hpx * 100);
        depth.textContent = p >= 99.9 ? label + " — that's all of it."
          : label + " — you've seen " + p.toFixed(p < 10 ? 1 : 0) + "%. Keep scrolling.";
      };
      wrap.addEventListener("scroll", update);
      update();
    }
  });
  return wrap;
}

/* Share cards — canvas PNG per beat */
function shareCard(title, stat, sub){
  const c = document.createElement("canvas");
  c.width = 1080; c.height = 1080;
  const x = c.getContext("2d");
  x.fillStyle = "#0a0e14"; x.fillRect(0,0,1080,1080);
  const accent = getComputedStyle(document.body).getPropertyValue("--accent").trim() || "#38e1ff";
  x.fillStyle = accent; x.fillRect(0,0,1080,14);
  x.font = "900 44px system-ui"; x.fillStyle = "#8fa0b8";
  x.fillText("THE GAP", 70, 130);
  x.fillStyle = "#e8eef7"; x.font = "900 64px system-ui";
  wrap(title, 70, 250, 940, 76);
  x.fillStyle = accent; x.font = "900 130px system-ui";
  wrap(stat, 70, 560, 940, 140);
  x.fillStyle = "#8fa0b8"; x.font = "700 40px system-ui";
  wrap(sub || "", 70, 840, 940, 54);
  x.fillStyle = "#57657d"; x.font = "700 30px system-ui";
  x.fillText("Real data · " + DATA.asOf + " · sources in game", 70, 1020);
  function wrap(text, tx, ty, maxW, lh){
    const words = String(text).split(" "); let line = "", y = ty;
    for (const w of words){
      if (x.measureText(line + w).width > maxW){ x.fillText(line, tx, y); line = w + " "; y += lh; }
      else line += w + " ";
    }
    x.fillText(line, tx, y);
  }
  c.toBlob(async blob=>{
    const file = new File([blob], "the-gap.png", {type:"image/png"});
    if (navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file], title:"THE GAP"}); return; }catch(e){}
    }
    const a = h("a",{href:URL.createObjectURL(blob), download:"the-gap.png"});
    document.body.append(a); a.click(); a.remove();
  });
}
function shareBtn(title, statFn, sub){

const D = {
  muskYearsToEarn: ()=> musk.worth / state.playerIncome,
  muskPerSecMarket: ()=> musk.worth * DATA.marketReturn / (365.25*86400),   // ≈$3,470/s at median... constant
  youPerWorkSec: ()=> state.playerIncome / (2087*3600),                      // on the clock
  youPerCalSec: ()=> state.playerIncome / (365.25*86400),
  salaryEverySec: ()=> state.playerIncome / (musk.worth*DATA.marketReturn/(365.25*86400)),
  enoughBoxes: ()=> Math.round(musk.worth / DATA.enoughBox),
  percentile(nw){
    const P = DATA.nwPercentiles;
    if (nw <= P[0][0]) return P[0][1];
    for (let i=1;i<P.length;i++){
      if (nw <= P[i][0]){
        const [x0,y0] = P[i-1], [x1,y1] = P[i];
        return y0 + (y1-y0)*(nw-x0)/(x1-x0);
      }
    }
    return .999999;
  }
};

S("b33", 3, el=>{

    h("p",{class:"lead"}, "Static, first-order estimates — no behavioral modeling, just honest multiplication against the real wealth bases. That's the point: even the crudest math shows the size of what's on the table."));
  const mkLever = (name, min, max, step, val, unit)=>{
    const read = h("span",{class:"lval"});
    const sl = h("input",{type:"range", min:String(min), max:String(max), step:String(step), value:String(val)});
    const row = h("div",{class:"lever"}, h("div",{class:"lhead"}, h("span",{class:"lname"},name), read), sl);
    return {row, sl, read, unit};
  };
  const L1 = mkLever("Annual wealth tax on fortunes above $50M", 0, 8, 0.5, 2, "%");
  const L2 = mkLever("Tax on billionaires' yearly wealth GAINS (like wages are taxed)", 0, 40, 1, 24, "%");
  const out = h("div",{class:"tradeoffs"});
  const yourNote = h("p",{class:"note"});
  el.append(L1.row, L1.sl, L2.row, L2.sl, out, yourNote);
  function calc(){
    const wt = +L1.sl.value/100, gt = +L2.sl.value/100;
    L1.read.textContent = (+L1.sl.value)+"%";
    L2.read.textContent = (+L2.sl.value)+"%";
    const base01 = DATA.us.totalWealth * DATA.us.top01Share;   // ~$25T proxy for >$50M fortunes

    DATA.tradeoffPrograms.forEach(p=>{

    });
    const after = DATA.marketReturn - wt - DATA.marketReturn*gt;
    out.append(h("div",{class:"tcard"},
      "And the piles? At 10.4% average growth, a top fortune still compounds at ",
      h("b",{}, fmt.pct(Math.max(0,after))), " after your levers. ",
      after > 0 ? "Still growing. Nobody's yacht is at risk." : "At this setting, piles finally stop outgrowing everyone else."));

  ok("musk $/sec market ≈ 3470", Math.abs(musk.worth*DATA.marketReturn/(365.25*86400) - 3470) < 100);
  ok("june gain ≈ $84k/sec", Math.abs(DATA.muskJuneGainPerSec - 84100) < 1000);
  ok("enough boxes = 10530", Math.round(musk.worth/DATA.enoughBox) === 10530);
  ok("Buffett ratio ≈ 244", Math.abs(DATA.us.workerTaxRate/DATA.trueTaxRates.find(t=>t.name.includes("Buffett")).rate - 244) < 5);
  ok("Musk ratio ≈ 7.5", Math.abs(DATA.us.workerTaxRate/DATA.trueTaxRates[0].rate - 7.46) < .2);
  ok("dividend lives = 351,000", Math.floor(musk.worth/DATA.wealthPerRicheLife) === 351000);
  ok("$3M @4% = $120k", DATA.wealthPerRicheLife*.04 === DATA.divIncome);
  ok("median-income lives ≈ 656k", Math.abs(Math.floor(musk.worth*.04/DATA.us.medianWage) - 655870) < 10);
  ok("UBI lives = 3.51M", Math.floor(musk.worth*.04/12000) === 3510000);
  ok("global UBI lives = 67M", Math.floor(DATA.global.billionaireWealth*.04/12000) === 67000000);
  ok("banquet sums to ~100%", Math.abs(DATA.us.top10Share + (1-DATA.us.top10Share-DATA.us.bottom50Share) + DATA.us.bottom50Share - 1) < 1e-9);
  ok("percentile(median) ≈ .5", Math.abs(D.percentile(192700) - .5) < .02);
})();
